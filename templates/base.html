
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Asymptote Wiki{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='asyicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}" class="logo">Asymptote Wiki</a>
            <a href="{{ url_for('new_page') }}" class="btn btn-primary">+ New Example</a>
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flashes">
              {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>
            Powered by <a href="https://asymptote.sourceforge.io">Asymptote</a> &middot;
            <a href="{{ url_for('index') }}">Main Page</a>
        </p>
    </footer>
</body>
</html>
