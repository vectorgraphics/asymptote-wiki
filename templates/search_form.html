
{# Search box + its clear-button behaviour. Included wherever a search input
   is needed (the main-page sidebar and the search results page). #}
<form action="{{ url_for('search') }}" method="get" class="search-form">
    <input type="text" name="q" placeholder="Search examples..."
           value="{{ search_query or '' }}" id="search-input">
    <button type="submit" class="btn btn-sm" title="Search" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" style="vertical-align:middle;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
    <button type="button" class="search-clear" id="search-clear"
            style="display:none;" title="Clear">&times;</button>
</form>
<script>
(function() {
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    if (!searchInput || !searchClear) return;
    const toggleClear = () => searchClear.style.display = searchInput.value ? '' : 'none';
    searchInput.addEventListener('input', toggleClear);
    toggleClear();
    searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
        toggleClear();
    });
})();
</script>
