{# Shared example-folder pager: up to folder + previous/next (when present). #}
{% macro example_nav(page, prev_page, next_page) -%}
    <a href="{% if page.category %}{{ url_for('view_category', cat=page.category) }}{% else %}{{ url_for('index') }}{% endif %}"
       class="btn btn-sm" title="Up to {{ page.category.split('/')[-1] if page.category else 'Main Page' }}"><svg class="nav-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.75V3.25M5 10.25l7-7 7 7"/></svg> {{ page.category.split('/')[-1] if page.category else 'Main Page' }}</a>
    {% if prev_page %}
    <a href="{{ url_for('view_page', page_rel=prev_page) }}" class="btn btn-sm" title="Previous example in this folder"><svg class="nav-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.75 12H3.25M10.25 5l-7 7 7 7"/></svg></a>
    {% endif %}
    {% if next_page %}
    <a href="{{ url_for('view_page', page_rel=next_page) }}" class="btn btn-sm" title="Next example in this folder"><svg class="nav-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.25 12H20.75M13.75 5l7 7-7 7"/></svg></a>
    {% endif %}
{%- endmacro %}
